x-app-environment: &app-environment
  DB_HOST: 'postgres'
  DB_PORT: '5432'
  POSTGRES_USER: '${POSTGRES_USER:-wallet}'
  POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-wallet}'
  POSTGRES_DB: '${POSTGRES_DB:-wallet}'
  SQS_ENDPOINT: 'http://sqs:4566'

services:
  postgres:
    image: 'postgres:17'
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-wallet}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-wallet}'
      POSTGRES_DB: '${POSTGRES_DB:-wallet}'
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck: 
      test: "pg_isready -U ${POSTGRES_USER:-wallet}"
      interval: 2s
      retries: 15
  
  sqs:
    image: 'nahuelnucera/ministack:1.5.34'
    ports:
      - '127.0.0.1:4566:4566'

  queues:
    image: 'amazon/aws-cli:2.39.1'
    profiles: ['app']
    entrypoint: ['bash', '/scripts/create-queues.sh']
    environment:
      SQS_ENDPOINT: 'http://sqs:4566'
    volumes:
      - './scripts:/scripts:ro'
    depends_on:
      sqs:
        condition: service_healthy

  migrate:
    build: .
    profiles: ['app']
    command: ['bun', 'src/migrate.ts']
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    profiles: ['app']
    environment: *app-environment
    healthcheck:
      test:
        - 'CMD'
        - 'bun'
        - '-e'
        - "fetch('http://localhost:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      queues:
        condition: service_completed_successfully

  gateway:
    image: 'nginx:1.27.5-alpine'
    profiles: ['app']
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    volumes:
      - './docker/nginx.conf:/etc/nginx/nginx.conf:ro'
    depends_on:
      app:
        condition: service_healthy