events {}

http {
  server_tokens off;

  upstream wallet_service {
    server app:3000;
  }

  server {
    listen 3000;

    location = /metrics {
      return 404;
    }

    location / {
      proxy_pass http://wallet_service;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
    }
  }
}
